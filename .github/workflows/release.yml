name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Two pushes close together must not update the release at the same time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            bin_ext: ""
            artifact_name: linux
          - os: macos-latest
            bin_ext: ""
            artifact_name: macos
          - os: windows-latest
            bin_ext: ".exe"
            artifact_name: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/release/cuniq${{ matrix.bin_ext }} dist/cuniq-${{ matrix.artifact_name }}${{ matrix.bin_ext }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.artifact_name }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The release keeps the same "latest" tag, so move it to this commit.
      - name: Move latest tag to this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/latest" \
            -f sha="${{ github.sha }}" -F force=true \
          || gh api -X POST "repos/${{ github.repository }}/git/refs" \
            -f ref=refs/tags/latest -f sha="${{ github.sha }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Build
          prerelease: false
          files: dist/*
